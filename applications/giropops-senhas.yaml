apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: giropops-senhas
  namespace: argocd
spec:
  project: default
  source:
    helm: {}
    repoURL: 'https://github.com/JoaoVictorCRP/descomplicando-gitops-no-kubernetes-com-argocd'
    targetRevision: feat/day2
    path: giropops-senhas/helm
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: giropops-senhas # A application fica no namespace argocd, mas os recursos dela serão criados no namespace giropops-senhas
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true # Cria o namespace giropops-senhas caso ele não exista